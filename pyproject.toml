[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-automation"
version = "0.1.0"
description = "Drop in a video + voiceover, get back captioned, profanity-filtered videos and vertical clips."
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vidauto = "video_automation.cli:main"

[tool.setuptools]
packages = ["video_automation"]

[tool.setuptools.package-data]
video_automation = ["profanity_words.txt", "default_config.yaml"]
